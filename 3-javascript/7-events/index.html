<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Web Siteme Hoş Geldiniz!</h1>
    <p>LocalStorage kullanarak tema tercihinizi kaydediyoruz.</p>
    <button id="theme-btn" class="btn">Koyu Moda Geç 🌛</button>

    <h1>Events</h1>

    <button id="action" class="btn">Bana Tıkla</button>

    <button id="menu-btn" class="btn">Menüyü Aç/Kapa</button>

    <ul id="menu">
      <li>Makarna</li>
      <li>Dürüm</li>
      <li>Çorba</li>
      <li>Hamburger</li>
      <li>Köfte</li>
    </ul>

    <div id="box" class="box">kutu</div>

    <form id="login-form">
      <br /><br />

      <label for="username">Kullanıcı Adı</label><br />
      <input id="username" name="username" type="email" /> <br /><br />

      <label for="password">Şifre</label><br />
      <input id="password" name="password" type="password" minlength="6" /> <br /><br />

      <button id="form-btn" type="submit" class="btn">Giriş Yap</button>
    </form>

    <!-- Örnek -->
    <h2>Hedef Listesi</h2>

    <form id="target-form">
      <input type="text" placeholder="hedefinizi yazınız..." />
      <button class="btn" type="submit">Ekle</button>
    </form>

    <ul id="target-list"></ul>

    <script src="main.js"></script>
  </body>
</html>
